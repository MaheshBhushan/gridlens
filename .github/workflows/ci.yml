name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen --extra local --group dev
      - name: Cache Delta jars
        uses: actions/cache@v4
        with:
          path: ~/.ivy2.5.2
          key: ivy-delta-4.0.0
      - name: Test
        env:
          TZ: UTC
        run: uv run --frozen pytest -q
      - name: Build wheel (Databricks job artifact)
        run: uv build --wheel && unzip -l dist/*.whl | grep -q gridlens/sql/views.sql
