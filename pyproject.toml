[project]
name = "gridlens"
version = "0.1.0"
description = "Smart meter lakehouse: Low Carbon London readings into Delta bronze/silver/gold with data-quality checks, load profiles, peak demand and an evaluated forecast."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# pyspark and delta-spark are provided by the Databricks runtime, so they live in the
# `local` extra and are not installed into the job environment there.
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
local = ["pyspark==4.0.1", "delta-spark==4.0.0"]

[project.scripts]
gridlens = "gridlens.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
